apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nof1-tracker.fullname" . }}
  labels:
    {{- include "nof1-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nof1-tracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/model: {{ .Values.model | toYaml | sha256sum }}
      labels:
        {{- include "nof1-tracker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nof1-tracker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command.enabled }}
          args:
            {{- if .Values.command.autoGenerate }}
            - "follow"
            - {{ .Values.model.name | quote }}
            - "--interval"
            - {{ .Values.model.interval | quote }}
            {{- if .Values.model.riskOnly }}
            - "--risk-only"
            {{- end }}
            {{- if .Values.model.priceTolerance }}
            - "--price-tolerance"
            - {{ .Values.model.priceTolerance | quote }}
            {{- end }}
            {{- if .Values.model.totalMargin }}
            - "--total-margin"
            - {{ .Values.model.totalMargin | quote }}
            {{- end }}
            {{- if .Values.model.fixedAmountPerCoin }}
            - "--fixed-amount-per-coin"
            - {{ .Values.model.fixedAmountPerCoin | quote }}
            {{- end }}
            {{- if .Values.model.profit }}
            - "--profit"
            - {{ .Values.model.profit | quote }}
            {{- end }}
            {{- if .Values.model.autoRefollow }}
            - "--auto-refollow"
            {{- end }}
            {{- if .Values.model.marginType }}
            - "--margin-type"
            - {{ .Values.model.marginType | quote }}
            {{- end }}
            {{- else }}
            {{- toYaml .Values.command.args | nindent 12 }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nof1-tracker.fullname" . }}-config
            - secretRef:
                name: {{ include "nof1-tracker.fullname" . }}-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
