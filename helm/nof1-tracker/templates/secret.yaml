apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nof1-tracker.fullname" . }}-secret
  labels:
    {{- include "nof1-tracker.labels" . | nindent 4 }}
type: Opaque
data:
  # Binance API配置
  BINANCE_API_KEY: {{ .Values.secrets.binance.apiKey | b64enc | quote }}
  BINANCE_API_SECRET: {{ .Values.secrets.binance.apiSecret | b64enc | quote }}

  # Telegram配置
  {{- if .Values.secrets.telegram.botToken }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegram.botToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.telegram.chatId }}
  TELEGRAM_CHAT_ID: {{ .Values.secrets.telegram.chatId | b64enc | quote }}
  {{- end }}
