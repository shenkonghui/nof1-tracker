# 默认配置值

# 镜像配置
image:
  registry: ghcr.io
  repository: shenkonghui/nof1-tracker
  pullPolicy: IfNotPresent
  tag: "dev"

# 部署配置
replicaCount: 1

# 服务账户配置
serviceAccount:
  create: false
  annotations: {}
  name: ""

# 资源限制
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# 环境变量配置
env:
  # 日志级别
  LOG_LEVEL: "INFO"
  # 是否启用测试网
  BINANCE_TESTNET: "true"
  # 是否启用Telegram通知
  TELEGRAM_ENABLED: "false"

# 密钥配置
secrets:
  # Binance API配置
  binance:
    apiKey: ""
    apiSecret: ""
  # Telegram配置
  telegram:
    botToken: ""
    chatId: ""

# 节点选择
nodeSelector: {}

# 容忍度
tolerations: []

# 亲和性
affinity: {}

# Pod安全上下文
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# 容器安全上下文
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
