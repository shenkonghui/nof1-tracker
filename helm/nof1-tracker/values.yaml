# 默认配置值

# 镜像配置
image:
  registry: ghcr.io
  repository: shenkonghui/nof1-tracker
  pullPolicy: IfNotPresent
  tag: "dev"

# 部署配置
replicaCount: 1

# 服务账户配置
serviceAccount:
  create: false
  annotations: {}
  name: ""

# AI模型配置
model:
  # 要跟随的AI模型名称
  name: "deepseek-chat-v3.1"
  # 轮询间隔（秒）
  interval: 30
  # 风险控制模式（只观察不执行交易）
  riskOnly: false
  # 价格容差百分比
  priceTolerance: 1.0
  # 总保证金（USDT）
  totalMargin: 10
  # 每个币种固定保证金（USDT）
  fixedAmountPerCoin: ""
  # 盈利目标百分比
  profit: ""
  # 是否自动重新跟单
  autoRefollow: false
  # 保证金模式：ISOLATED（逐仓）或 CROSSED（全仓）
  marginType: "CROSSED"

# 运行命令配置
command:
  # 是否启用命令配置
  enabled: true
  # 自动从model配置生成命令参数
  autoGenerate: true
  # 手动指定命令参数（如果autoGenerate为false）
  args: []

# 资源限制
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# 环境变量配置
env:
  # 日志级别
  LOG_LEVEL: "INFO"
  # 是否启用测试网
  BINANCE_TESTNET: "true"
  # 是否启用Telegram通知
  TELEGRAM_ENABLED: "false"

# 密钥配置
secrets:
  # Binance API配置
  binance:
    apiKey: ""
    apiSecret: ""
  # Telegram配置
  telegram:
    botToken: ""
    chatId: ""

# 节点选择
nodeSelector: {}

# 容忍度
tolerations: []

# 亲和性
affinity: {}

# Pod安全上下文
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# 容器安全上下文
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
